[build-dependencies]
capnpc = "0.25"

[dependencies]
axum = "0.8"
tokio = {version = "1", features = ["rt-multi-thread", "net"]}
capnp = {version = "0.25", features = ["unaligned"]}
memmap2 = "0.9"
rand = "0.9"
rand_xoshiro = "0.7"
fnv = "1"
mime_guess = "2"

[package]
name = "fastpit"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[profile.release]
lto = true
codegen-units = 1
