# Whitelist for `nix run .#vulnix`.
#
# Every entry was verified by reading the NVD description and comparing it with
# the packaged product. An entry with a `cve` key whitelists only those CVEs;
# an entry without one whitelists every CVE of that package version.
#
# Name collisions with an unrelated product are keyed on the package alone and
# list the other product's CVEs explicitly, so a future advisory on the real
# package still shows up. Entries that pin a version are real advisories that
# do not apply to the packaged version; the pin makes a version bump resurface
# them for review.

["ada"]
cve = "CVE-2024-9410"
comment = "Ada.cx Sentry SSRF; this is the Ada programming language toolchain"

["avahi"]
cve = "CVE-2021-26720"
comment = "Debian avahi-daemon-check-dns.sh packaging script, not upstream avahi"

["brotli-1.2.1"]
comment = "CVE-2026-111497 affects brotli 1.0.3 through 1.2.0; 1.2.1 is the fixed release"

["clickhouse"]
cve = "CVE-2026-111497"
comment = "brotli decompression overflow, not ClickHouse"

